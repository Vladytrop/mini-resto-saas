server:
  port: 8081

spring:

  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        cluster:
          read-from: replica_preferred

        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2

  session:
    timeout: 30m
    store-type: redis

  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://localhost:5432/resto_saas
    username: resto_app
    password: app_secret
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: localhost:19092,localhost:19093,localhost:19094
    producer:
      acks: all
      retries: 3
      enable-idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.resto.saas: DEBUG
