server:
  port: 8081

spring:

  data:
    redis:
      sentinel:
        master:  mymaster
        nodes:
          - localhost:26379
          - localhost:26380
          - localhost:26381
      password:
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false
      key-prefix: "resto:"
      use-key-prefix: true

  session:
    timeout: 30m
    store-type: redis

  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://localhost:5432/resto_saas
    username: resto_app
    password: app_secret
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: localhost:19092,localhost:19093,localhost:19094
    producer:
      acks: all
      retries: 3
      enable-idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.resto.saas: DEBUG
