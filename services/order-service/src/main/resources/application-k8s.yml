spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/resto_saas
    username: resto_admin
    password: resto_secret
  data:
    redis:
      host: redis
      port: 6379
  kafka:
    bootstrap-servers: kafka:9092

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
