spring:
  cloud:
    gateway:
      routes:
        - id: swagger-ui
          uri: http://localhost:8080
          predicates:
            - Path=/swagger-ui.html,/swagger-ui/**,/webjars/**
          filters:
            - RewritePath=/swagger-ui.html, /webjars/swagger-ui/index.html
        - id: order-service-api-docs
          uri: http://order-service:8081
          predicates:
            - Path=/v3/api-docs/order-service
          filters:
            - RewritePath=/v3/api-docs/order-service, /v3/api-docs
        - id: loyalty-service-api-docs
          uri: http://loyalty-service:8082
          predicates:
            - Path=/v3/api-docs/loyalty-service
          filters:
            - RewritePath=/v3/api-docs/loyalty-service, /v3/api-docs
        - id: order-service
          uri: http://order-service:8081
          predicates:
            - Path=/api/orders/**
          filters:
            - StripPrefix=1
        - id: loyalty-service
          uri: http://loyalty-service:8082
          predicates:
            - Path=/api/loyalty/**
          filters:
            - StripPrefix=1
        - id: payment-service
          uri: http://payment-service:8083
          predicates:
            - Path=/api/payments/**
          filters:
            - StripPrefix=1
        - id: analytics-service
          uri: http://analytics-service:8084
          predicates:
            - Path=/api/analytics/**
          filters:
            - StripPrefix=1

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls:
      - name: Order Service
        url: /v3/api-docs/order-service
      - name: Loyalty Service
        url: /v3/api-docs/loyalty-service