server:
  port: 8080
  netty:
    max-initial-line-length: 65536
    max-header-size: 65536

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: redis
      port: 6379
      password: ""
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      routes:
        - id: order-service-api-docs
          uri: http://order-service:8081
          predicates:
            - Path=/v3/api-docs/order-service
          filters:
            - RewritePath=/v3/api-docs/order-service, /v3/api-docs
        - id: loyalty-service-api-docs
          uri: http://loyalty-service:8082
          predicates:
            - Path=/v3/api-docs/loyalty-service
          filters:
            - RewritePath=/v3/api-docs/loyalty-service, /v3/api-docs
        - id: order-service
          uri: http://order-service:8081
          predicates:
            - Path=/api/orders/**
        - id: loyalty-service
          uri: http://loyalty-service:8082
          predicates:
            - Path=/api/loyalty/**
        - id: payment-service
          uri: http://payment-service:8083
          predicates:
            - Path=/api/payments/**
          filters:
            - StripPrefix=1
        - id: analytics-service
          uri: http://analytics-service:8084
          predicates:
            - Path=/api/analytics/**
          filters:
            - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true
