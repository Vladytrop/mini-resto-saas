version: "3.9"

services:

  redis:
    image: redis:7-alpine
    container_name: resto-redis-master-1
    ports:
      - "7001:7001"
      - "17001:17001"
    command: >
      sh -c "redis-server
      --port 7001
      --cluster-enabled yes
      --cluster-config-file nodes-7001.conf
      --cluster-node-timeout 5000
      --cluster-announce-port 7001
      --cluster-announce-bus-port 17001
      --appendonly yes
      --maxmemory 682mb
      --maxmemory-policy allkeys-lru
      --bind 0.0.0.0
      --protected-mode no"
    volumes:
      - redis-master-1-data:/data
    networks:
      - resto-network
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7001", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-master-2:
    image: redis:7-alpine
    container_name: resto-redis-master-2
    ports:
      - "7002:7002"
      - "17002:17002"
    command: >
      sh -c "redis-server
      --port 7002
      --cluster-enabled yes
      --cluster-config-file nodes-7002.conf
      --cluster-node-timeout 5000
      --cluster-announce-port 7002
      --cluster-announce-bus-port 17002
      --appendonly yes
      --maxmemory 682mb
      --maxmemory-policy allkeys-lru
      --bind 0.0.0.0
      --protected-mode no"
    volumes:
      - redis-master-2-data:/data
    networks:
      - resto-network
    healthcheck:
      test: [ "CMD", "redis-cli", "-p", "7002", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-master-3:
    image: redis:7-alpine
    container_name: resto-redis-master-3
    ports:
      - "7003:7003"
      - "17003:17003"
    command: >
      sh -c "redis-server
      --port 7003
      --cluster-enabled yes
      --cluster-config-file nodes-7003.conf
      --cluster-node-timeout 5000
      --cluster-announce-port 7003
      --cluster-announce-bus-port 17003
      --appendonly yes
      --maxmemory 682mb
      --maxmemory-policy allkeys-lru
      --bind 0.0.0.0
      --protected-mode no"
    volumes:
      - redis-master-3-data:/data
    networks:
      - resto-network
    healthcheck:
      test: [ "CMD", "redis-cli", "-p", "7003", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-replica-1:
    image: redis:7-alpine
    container_name: resto-redis-replica-1
    ports:
      - "7004:7004"
      - "17004:17004"
    command: >
      sh -c "redis-server
      --port 7004
      --cluster-enabled yes
      --cluster-config-file nodes-7004.conf
      --cluster-node-timeout 5000
      --cluster-announce-port 7004
      --cluster-announce-bus-port 17004
      --appendonly yes
      --maxmemory 682mb
      --maxmemory-policy allkeys-lru
      --bind 0.0.0.0
      --protected-mode no"
    volumes:
      - redis-replica-1-data:/data
    networks:
      - resto-network
    healthcheck:
      test: [ "CMD", "redis-cli", "-p", "7004", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-replica-2:
    image: redis:7-alpine
    container_name: resto-redis-replica-2
    ports:
      - "7005:7005"
      - "17005:17005"
    command: >
      sh -c "redis-server
      --port 7005
      --cluster-enabled yes
      --cluster-config-file nodes-7005.conf
      --cluster-node-timeout 5000
      --cluster-announce-port 7005
      --cluster-announce-bus-port 17005
      --appendonly yes
      --maxmemory 682mb
      --maxmemory-policy allkeys-lru
      --bind 0.0.0.0
      --protected-mode no"
    volumes:
      - redis-replica-2-data:/data
    networks:
      - resto-network
    healthcheck:
      test: [ "CMD", "redis-cli", "-p", "7005", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-replica-3:
    image: redis:7-alpine
    container_name: resto-redis-replica-3
    ports:
      - "7006:7006"
      - "17006:17006"
    command: >
      sh -c "redis-server
      --port 7006
      --cluster-enabled yes
      --cluster-config-file nodes-7006.conf
      --cluster-node-timeout 5000
      --cluster-announce-port 7006
      --cluster-announce-bus-port 17006
      --appendonly yes
      --maxmemory 682mb
      --maxmemory-policy allkeys-lru
      --bind 0.0.0.0
      --protected-mode no"
    volumes:
      - redis-replica-3-data:/data
    networks:
      - resto-network
    healthcheck:
      test: [ "CMD", "redis-cli", "-p", "7006", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-cluster-init:
    image: redis:7-alpine
    container_name: resto-redis-init
    depends_on:
      redis-master-1:
        condition: service_healthy
      redis-master-2:
        condition: service_healthy
      redis-master-3:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy
      redis-replica-3:
        condition: service_healthy
    command: >
      sh -c "sleep 3 &&
      redis-cli --cluster create
      resto-redis-master-1:7001
      resto-redis-master-2:7002
      resto-redis-master-3:7003
      resto-redis-replica-1:7004
      resto-redis-replica-2:7005
      resto-redis-replica-3:7006
      --cluster-replicas 1
      --cluster-yes"
    networks:
      - resto-network
    restart: "no"

  kafka-1:
    image: apache/kafka:3.7.0
    container_name: resto-kafka-1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@resto-kafka-1:9093,2@resto-kafka-2:9093,3@resto-kafka-3:9093

      KAFKA_LISTENERS: INTERNAL://resto-kafka-1:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://resto-kafka-1:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://resto-kafka-1:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-1-data:/tmp/kraft-combined-logs
    ports:
      - 19092:9094
    networks:
      - resto-network

  kafka-2:
    image: apache/kafka:3.7.0
    container_name: resto-kafka-2
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@resto-kafka-1:9093,2@resto-kafka-2:9093,3@resto-kafka-3:9093

      KAFKA_LISTENERS: INTERNAL://resto-kafka-2:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://resto-kafka-2:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://resto-kafka-2:9092,EXTERNAL://localhost:19093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-2-data:/tmp/kraft-combined-logs
    ports:
      - 19093:9094
    networks:
      - resto-network

  kafka-3:
    image: apache/kafka:3.7.0
    container_name: resto-kafka-3
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@resto-kafka-1:9093,2@resto-kafka-2:9093,3@resto-kafka-3:9093

      KAFKA_LISTENERS: INTERNAL://resto-kafka-3:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://resto-kafka-3:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://resto-kafka-3:9092,EXTERNAL://localhost:19094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-3-data:/tmp/kraft-combined-logs
    ports:
      - 19094:9094
    networks:
      - resto-network

  postgres:
    image: postgres:16-alpine
    container_name: resto-postgres
    environment:
      POSTGRES_USER: resto_admin
      POSTGRES_PASSWORD: resto_secret
      POSTGRES_DB: resto_saas
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - resto-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resto_admin -d resto_saas"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  redis-master-1-data:
  redis-master-2-data:
  redis-master-3-data:
  redis-replica-1-data:
  redis-replica-2-data:
  redis-replica-3-data:

networks:
  resto-network:
    driver: bridge