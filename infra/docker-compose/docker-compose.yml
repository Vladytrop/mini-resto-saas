version: "3.9"

services:
  redis-master:
    image: redis:7-alpine
    container_name: resto-redis-master
    ports:
      - "6379:6379"
    volumes:
      - redis-master-data:/data
    command: >
      sh -c "echo 'appendonly yes' > /etc/redis.conf &&
             echo 'appendfsync everysec' >> /etc/redis.conf &&
             redis-server /etc/redis.conf"
    networks:
      - resto-network
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "resto_redis_pass", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-replica:
    image: redis:7-alpine
    container_name: resto-redis-replica
    ports:
      - "6380:6379"
    command: >
      sh -c "echo 'replicaof redis-master 6379' > /etc/redis.conf &&
             echo 'appendonly yes' >> /etc/redis.conf &&
             redis-server /etc/redis.conf"
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - resto-network
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "resto_redis_pass", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka-1:
    image: apache/kafka:3.7.0
    container_name: resto-kafka-1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@resto-kafka-1:9093,2@resto-kafka-2:9093,3@resto-kafka-3:9093

      KAFKA_LISTENERS: INTERNAL://resto-kafka-1:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://resto-kafka-1:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://resto-kafka-1:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-1-data:/tmp/kraft-combined-logs
    ports:
      - 19092:9094
    networks:
      - resto-network

  kafka-2:
    image: apache/kafka:3.7.0
    container_name: resto-kafka-2
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@resto-kafka-1:9093,2@resto-kafka-2:9093,3@resto-kafka-3:9093

      KAFKA_LISTENERS: INTERNAL://resto-kafka-2:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://resto-kafka-2:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://resto-kafka-2:9092,EXTERNAL://localhost:19093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-2-data:/tmp/kraft-combined-logs
    ports:
      - 19093:9094
    networks:
      - resto-network

  kafka-3:
    image: apache/kafka:3.7.0
    container_name: resto-kafka-3
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@resto-kafka-1:9093,2@resto-kafka-2:9093,3@resto-kafka-3:9093

      KAFKA_LISTENERS: INTERNAL://resto-kafka-3:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://resto-kafka-3:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://resto-kafka-3:9092,EXTERNAL://localhost:19094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-3-data:/tmp/kraft-combined-logs
    ports:
      - 19094:9094
    networks:
      - resto-network

  postgres:
    image: postgres:16-alpine
    container_name: resto-postgres
    environment:
      POSTGRES_USER: resto_admin
      POSTGRES_PASSWORD: resto_secret
      POSTGRES_DB: resto_saas
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - resto-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resto_admin -d resto_saas"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: resto-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - resto-network

  grafana:
    image: grafana/grafana:11.0.0
    container_name: resto-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - resto-network

volumes:
  postgres_data:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  redis-master-data:
  redis-replica-data:

networks:
  resto-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16