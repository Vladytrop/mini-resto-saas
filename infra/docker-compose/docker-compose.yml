version: "3.9"

services:
  redis-master:
    image: redis:7-alpine
    container_name: resto-redis-master
    ports:
      - "6379:6379"
    command: redis-server --port 6379 --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru --bind 0.0.0.0 --protected-mode no
    volumes:
      - redis-master-data:/data
    networks:
      - resto-network
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-replica:
    image: redis:7-alpine
    container_name: resto-redis-replica
    ports:
      - "6380:6379"
    command: redis-server --port 6379 --replicaof redis-master 6379 --appendonly yes --bind 0.0.0.0 --protected-mode no
    volumes:
      - redis-replica-data:/data
    networks:
      - resto-network
    depends_on:
      - redis-master
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-sentinel-1:
    image: redis:7-alpine
    container_name: resto-redis-sentinel-1
    ports:
      - "26379:26379"
    links:
      - redis-master:redis-master
      - redis-replica:redis-replica
    entrypoint: >
      sh -c "
            until ping -c 1 redis-master >/dev/null 2>&1; do
              echo 'Waiting for redis-master...'
              sleep 1
            done &&
            MASTER_IP=$$(ping -c 1 redis-master | head -1 | awk -F'[()]' '{print $$2}') &&
            echo 'Master IP: '$$MASTER_IP &&
            mkdir -p /etc/redis &&
            echo 'port 26379' > /etc/redis/sentinel.conf &&
            echo 'sentinel monitor mymaster '$$MASTER_IP' 6379 2' >> /etc/redis/sentinel.conf &&
            echo 'sentinel down-after-milliseconds mymaster 5000' >> /etc/redis/sentinel.conf &&
            echo 'sentinel failover-timeout mymaster 10000' >> /etc/redis/sentinel.conf &&
            echo 'sentinel parallel-syncs mymaster 1' >> /etc/redis/sentinel.conf &&
            redis-sentinel /etc/redis/sentinel.conf
            "
    networks:
      - resto-network
    depends_on:
      - redis-master
      - redis-replica
    restart: unless-stopped

  redis-sentinel-2:
    image: redis:7-alpine
    container_name: resto-redis-sentinel-2
    ports:
      - "26380:26379"
    links:
      - redis-master:redis-master
      - redis-replica:redis-replica
    entrypoint: >
      sh -c "
            until ping -c 1 redis-master >/dev/null 2>&1; do
              echo 'Waiting for redis-master...'
              sleep 1
            done &&
            MASTER_IP=$$(ping -c 1 redis-master | head -1 | awk -F'[()]' '{print $$2}') &&
            echo 'Master IP: '$$MASTER_IP &&
            mkdir -p /etc/redis &&
            echo 'port 26379' > /etc/redis/sentinel.conf &&
            echo 'sentinel monitor mymaster '$$MASTER_IP' 6379 2' >> /etc/redis/sentinel.conf &&
            echo 'sentinel down-after-milliseconds mymaster 5000' >> /etc/redis/sentinel.conf &&
            echo 'sentinel failover-timeout mymaster 10000' >> /etc/redis/sentinel.conf &&
            echo 'sentinel parallel-syncs mymaster 1' >> /etc/redis/sentinel.conf &&
            redis-sentinel /etc/redis/sentinel.conf
            "
    networks:
      - resto-network
    depends_on:
      - redis-master
      - redis-replica
    restart: unless-stopped

  redis-sentinel-3:
    image: redis:7-alpine
    container_name: resto-redis-sentinel-3
    ports:
      - "26381:26379"
    links:
      - redis-master:redis-master
      - redis-replica:redis-replica
    entrypoint: >
      sh -c "
            until ping -c 1 redis-master >/dev/null 2>&1; do
              echo 'Waiting for redis-master...'
              sleep 1
            done &&
            MASTER_IP=$$(ping -c 1 redis-master | head -1 | awk -F'[()]' '{print $$2}') &&
            echo 'Master IP: '$$MASTER_IP &&
            mkdir -p /etc/redis &&
            echo 'port 26379' > /etc/redis/sentinel.conf &&
            echo 'sentinel monitor mymaster '$$MASTER_IP' 6379 2' >> /etc/redis/sentinel.conf &&
            echo 'sentinel down-after-milliseconds mymaster 5000' >> /etc/redis/sentinel.conf &&
            echo 'sentinel failover-timeout mymaster 10000' >> /etc/redis/sentinel.conf &&
            echo 'sentinel parallel-syncs mymaster 1' >> /etc/redis/sentinel.conf &&
            redis-sentinel /etc/redis/sentinel.conf
            "
    networks:
      - resto-network
    depends_on:
      - redis-master
      - redis-replica
    restart: unless-stopped

  kafka-1:
    image: apache/kafka:3.7.0
    container_name: resto-kafka-1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@resto-kafka-1:9093,2@resto-kafka-2:9093,3@resto-kafka-3:9093

      KAFKA_LISTENERS: INTERNAL://resto-kafka-1:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://resto-kafka-1:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://resto-kafka-1:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-1-data:/tmp/kraft-combined-logs
    ports:
      - 19092:9094
    networks:
      - resto-network

  kafka-2:
    image: apache/kafka:3.7.0
    container_name: resto-kafka-2
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@resto-kafka-1:9093,2@resto-kafka-2:9093,3@resto-kafka-3:9093

      KAFKA_LISTENERS: INTERNAL://resto-kafka-2:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://resto-kafka-2:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://resto-kafka-2:9092,EXTERNAL://localhost:19093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-2-data:/tmp/kraft-combined-logs
    ports:
      - 19093:9094
    networks:
      - resto-network

  kafka-3:
    image: apache/kafka:3.7.0
    container_name: resto-kafka-3
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@resto-kafka-1:9093,2@resto-kafka-2:9093,3@resto-kafka-3:9093

      KAFKA_LISTENERS: INTERNAL://resto-kafka-3:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://resto-kafka-3:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://resto-kafka-3:9092,EXTERNAL://localhost:19094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-3-data:/tmp/kraft-combined-logs
    ports:
      - 19094:9094
    networks:
      - resto-network

  postgres:
    image: postgres:16-alpine
    container_name: resto-postgres
    environment:
      POSTGRES_USER: resto_admin
      POSTGRES_PASSWORD: resto_secret
      POSTGRES_DB: resto_saas
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - resto-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resto_admin -d resto_saas"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  redis-master-data:
  redis-replica-data:

networks:
  resto-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16