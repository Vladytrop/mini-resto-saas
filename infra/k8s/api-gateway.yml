apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: resto-saas
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          imagePullPolicy: IfNotPresent
          image: vladytrop/resto-api-gateway:k8s-fix10 # сборка через CI/CD
          ports:
            - containerPort: 8080
          env:
            - name: ORDER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: resto-config
                  key: ORDER_SERVICE_URL
            - name: LOYALTY_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: resto-config
                  key: LOYALTY_SERVICE_URL
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: resto-saas
spec:
  type: NodePort  # локальный minikube/kind
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080  # доступ на localhost:30080