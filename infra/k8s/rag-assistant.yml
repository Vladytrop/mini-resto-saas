apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-assistant
  namespace: resto-saas
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rag-assistant
  template:
    metadata:
      labels:
        app: rag-assistant
    spec:
      containers:
        - name: rag-assistant
          imagePullPolicy: IfNotPresent
          image: vladytrop/resto-rag-assistant:latest
          ports:
            - containerPort: 8085
          env:
            - name: DB_HOST
              value: "rag-postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "rag_db"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: resto-secrets
                  key: POSTGRES_APP_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: resto-secrets
                  key: POSTGRES_APP_PASSWORD
            - name: REDIS_HOST
              value: "redis-master"
            - name: RAG_INGESTION_AUTO_RUN_ON_STARTUP
              value: "false"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: rag-assistant
  namespace: resto-saas
spec:
  selector:
    app: rag-assistant
  ports:
    - port: 8085
      targetPort: 8085