name: Build, Test and Docker Push

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: ./gradlew clean bootJar

      - name: Run tests
        run: ./gradlew test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: vladytrop
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker images
        if: github.ref == 'refs/heads/main'
        run: |
          docker build -t vladytrop//resto-order-service:latest ./services/order-service
          docker build -t vladytrop//resto-loyalty-service:latest ./services/loyalty-service
          docker build -t vladytrop//resto-api-gateway:latest ./services/api-gateway
          
          docker push vladytrop//resto-order-service:latest
          docker push vladytrop//resto-loyalty-service:latest
          docker push vladytrop//resto-api-gateway:latest

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/build/reports/tests/
            **/build/libs/