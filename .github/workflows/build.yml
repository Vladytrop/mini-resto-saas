name: Build, Test and Docker Push

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: ./gradlew clean bootJar

      - name: Run tests
        run: ./gradlew test

      - name: Debug Docker secrets
        run: |
          echo "Username: ${{ secrets.DOCKER_USERNAME }}"
          echo "Token starts with: $(echo ${{ secrets.DOCKER_PASSWORD }} | cut -c1-10)"
        shell: bash

      - name: Build and push Docker images
        if: github.ref == 'refs/heads/main'
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/resto-order-service:latest ./services/order-service
          docker build -t ${{ secrets.DOCKER_USERNAME }}/resto-loyalty-service:latest ./services/loyalty-service
          docker build -t ${{ secrets.DOCKER_USERNAME }}/resto-payment-service:latest ./services/payment-service
          docker build -t ${{ secrets.DOCKER_USERNAME }}/resto-api-gateway:latest ./services/api-gateway
          
          docker push ${{ secrets.DOCKER_USERNAME }}/resto-order-service:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/resto-loyalty-service:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/resto-payment-service:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/resto-api-gateway:latest

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/build/reports/tests/
            **/build/libs/
  docker-build:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Jars
        uses: gradle/actions/setup-gradle@v3
      - run: ./gradlew bootJar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
          logout: 'true'

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/resto-order-service:latest ./services/order-service
          docker build -t ${{ secrets.DOCKER_USERNAME }}/resto-loyalty-service:latest ./services/loyalty-service
          docker build -t ${{ secrets.DOCKER_USERNAME }}/resto-payment-service:latest ./services/payment-service
          docker build -t ${{ secrets.DOCKER_USERNAME }}/resto-api-gateway:latest ./services/api-gateway
          
          docker push ${{ secrets.DOCKER_USERNAME }}/resto-order-service:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/resto-loyalty-service:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/resto-payment-service:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/resto-api-gateway:latest