name: Build, Test, Docker Push & Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ${{ secrets.DOCKER_USERNAME }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: ./gradlew clean bootJar

      - name: Run tests
        run: ./gradlew test

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/build/reports/tests/
            **/build/libs/

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [order-service, loyalty-service, payment-service, api-gateway, analytics-service]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build JAR
        uses: gradle/actions/setup-gradle@v3
      - run: ./gradlew :services:${{ matrix.service }}:bootJar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/resto-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/resto-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-k8s:
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' && env.HAS_KUBECONFIG == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Check KUBECONFIG secret
        id: check
        run: |
          if [ -z "${{ secrets.KUBECONFIG }}" ]; then
            echo "HAS_KUBECONFIG=false" >> $GITHUB_ENV
            echo ">>> KUBECONFIG не настроен. Deploy пропущен. <<<"
            exit 0
          fi
          echo "HAS_KUBECONFIG=true" >> $GITHUB_ENV

      - name: Setup kubectl
        if: env.HAS_KUBECONFIG == 'true'
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.30.0'

      - name: Deploy to Kubernetes
        if: env.HAS_KUBECONFIG == 'true'
        run: |
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig

          kubectl set image deployment/order-service \
            order-service=${{ env.REGISTRY }}/resto-order-service:${{ github.sha }} -n resto-saas
          kubectl set image deployment/loyalty-service \
            loyalty-service=${{ env.REGISTRY }}/resto-loyalty-service:${{ github.sha }} -n resto-saas
          kubectl set image deployment/payment-service \
            payment-service=${{ env.REGISTRY }}/resto-payment-service:${{ github.sha }} -n resto-saas
          kubectl set image deployment/api-gateway \
            api-gateway=${{ env.REGISTRY }}/resto-api-gateway:${{ github.sha }} -n resto-saas

          kubectl set image deployment/analytics-service \
            analytics-service=${{ env.REGISTRY }}/resto-analytics-service:${{ github.sha }} -n resto-saas

          kubectl rollout status deployment/order-service -n resto-saas
          kubectl rollout status deployment/loyalty-service -n resto-saas
          kubectl rollout status deployment/analytics-service -n resto-saas
          kubectl rollout status deployment/api-gateway -n resto-saas